name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-compile:
    name: Python compile (node registration / syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every node package
        run: |
          # Compile the whole repository so a newly added package can never be
          # left out of this list the way it was before v0.4.11.
          python -m compileall -q .
      - name: Node behaviour regression tests (no ComfyUI runtime)
        run: |
          for f in tests/test_*.py; do
            echo "== $f =="
            python "$f"
          done

  js-syntax:
    name: Frontend JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse every frontend module (ESM syntax check)
        run: npx --yes esbuild js/*.js --outdir=/tmp/esbuild-check --format=esm --log-level=warning
      - name: Frontend unit tests
        run: |
          # 프론트엔드 단위 테스트는 지금 하나도 없다. 글롭이 안 맞으면 셸이
          # 패턴 문자열을 그대로 넘겨서 node 가 죽으므로, 있을 때만 돈다.
          shopt -s nullglob
          files=(tests/js/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "프론트엔드 단위 테스트 없음 — 건너뜀"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== $f =="
            node "$f"
          done
